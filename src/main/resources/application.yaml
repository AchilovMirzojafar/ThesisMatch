spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            # kein scope: der Login braucht nur die öffentlichen Profildaten (Standard "read:user")
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:iamgroot}

# GitHub-IDs der Administratoren, kommagetrennt. Kann über die Umgebungsvariable ADMINS überschrieben werden.
security:
  admins: ${ADMINS:116162742,147902436,115821857}
