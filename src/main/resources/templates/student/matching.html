<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>ThesisMatch - Matching</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/public.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
        <a class="navbar-brand fw-bold fs-4 text-dark text-decoration-none" th:href="@{/home}">ThesisMatch</a>
        <div class="ms-auto d-flex gap-2" sec:authorize="isAuthenticated()">
            <a th:href="@{/admin}" class="btn btn-dark" sec:authorize="hasRole('ADMIN')">Adminansicht</a>
            <a th:href="@{/profil}" class="btn btn-dark" sec:authorize="hasRole('BETREUER')">Profil</a>
            <a th:href="@{/home}" class="btn btn-dark" sec:authorize="!hasAnyRole('BETREUER')">Home</a>
            <a th:href="@{/betreuende}" class="btn btn-dark" sec:authorize="!hasAnyRole('BETREUER')">Betreuende</a>
            <a th:href="@{/themen}" class="btn btn-dark" sec:authorize="!hasAnyRole('BETREUER')">Themen</a>
            <a th:href="@{/matching}" class="btn btn-dark" sec:authorize="!hasAnyRole('BETREUER')">Matching</a>
        </div>
    </nav>

    <main class="container my-5">

        <!-- PAGE HEADER -->
        <div class="mb-4">
            <h1 class="fw-bold">Matching durchführen</h1>
            <p class="text-muted">
                Finde passende Betreuende und Themen basierend auf deinen bestandenen Kursen und Interessen.
            </p>
        </div>

        <!-- SEARCH & FILTER CARD -->
        <section class="card shadow-sm mb-4">
            <div class="card-body">

                <form method="get" action="/matching" class="row g-3">

                    <!-- Courses -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Bestandene Kurse</label>

                        <div class="border rounded p-3 bg-white">
                            <div class="form-check mb-2" th:each="kurs : ${matching.kurse}">
                                <input class="form-check-input" type="checkbox" name="kurse"
                                    th:id="${'kurs-' + #strings.replace(kurs,' ','_')}"
                                    th:value="${kurs}"
                                    th:checked="${param.kurse != null and #lists.contains(param.kurse, kurs)}">
                                <label class="form-check-label" th:for="${'kurs-' + #strings.replace(kurs,' ','_')}"
                                 th:text="${kurs}">
                                </label>
                            </div>
                        </div>
                    </div>


                    <!-- Interests -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Interessen</label>

                        <div class="border rounded p-3 bg-white">
                            <div class="form-check mb-2" th:each="tag : ${matching.interessen}">
                                <input class="form-check-input" type="checkbox" name="interessen"
                                    th:id="${'tag-' + #strings.replace(tag,' ','_')}" th:value="${tag}"
                                    th:checked="${param.interessen != null and #lists.contains(param.interessen, tag)}">
                                <label class="form-check-label" th:for="${'tag-' + #strings.replace(tag,' ','_')}"
                                 th:text="${tag}">
                                </label>
                            </div>
                        </div>
                    </div>


                    <!-- Submit -->
                    <div class="col-12 mt-3 d-flex align-items-center gap-2">

                        <!-- Eingaben & Filter -->
                        <button class="btn btn-dark rounded-pill d-flex align-items-center gap-2" type="submit"
                            data-bs-toggle="offcanvas" data-bs-target="#filterOffcanvas"
                            aria-controls="filterOffcanvas">
                            <i class="fa-solid fa-sliders"></i>
                            Eingaben &amp; Filter
                        </button>

                        <!-- Zurücksetzen -->
                        <a th:href="@{/matching}" class="btn btn-outline-secondary">
                            Zurücksetzen
                        </a>

                    </div>

                </form>

            </div>
        </section>

        <section th:if="${results != null and !results.isEmpty()}" class="mt-4">

            <h4 class="fw-bold mb-3">Vorschläge</h4>

            <div class="row g-3">
                <div class="col-md-6" th:each="r : ${results}">
                    <div class="card shadow-sm h-100 position-relative">

                        <!-- SCORE (top right) -->
                        <div class="position-absolute top-0 end-0 p-3 text-end">
                            <div class="text-muted small">Score</div>
                            <div class="fw-bold fs-4" th:text="${r.score} + '%'"></div>
                        </div>

                        <div class="card-body">

                            <!-- Thema -->
                            <h5 class="fw-bold mb-2" th:text="${r.thema.title}"></h5>

                            <!-- Betreuende -->
                            <p class="mb-2">
                                <strong>Betreuende:</strong>
                                <span
                                    th:text="${r.betreuer.titel + ' ' + r.betreuer.firstName + ' ' + r.betreuer.lastName}"></span>
                            </p>

                            <!-- Matching details -->
                            <ul class="mb-3">
                                <li>
                                    <span th:text="${r.matchedRequirements}"></span> /
                                    <span th:text="${r.totalRequirements}"></span>
                                    Anforderungen erfüllt
                                </li>
                                <li>
                                    <span th:text="${r.matchedTags}"></span> /
                                    <span th:text="${r.totalTags}"></span>
                                    Tag-Überschneidungen
                                </li>
                            </ul>

                            <!-- Thema und Betreunde Tags -->

                            <div class="mt-2">
                                <span class="badge bg-dark me-1" th:each="req : ${r.thema.requirements}"
                                    th:text="${req}"></span>
                            </div>
                            <div>
                                <span class="badge bg-light text-dark me-1" th:each="tag : ${r.thema.tags}"
                                    th:text="${tag}"></span>
                                <span class="badge bg-light text-dark me-1" th:each="tag : ${r.betreuer.tags}"
                                    th:text="${tag}"></span>
                            </div>


                        </div>
                    </div>
                </div>
            </div>

        </section>



    </main>



</body>

</html>
