<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>ThesisMatch - Betreuende</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
        <a class="navbar-brand fw-bold fs-4 text-dark text-decoration-none" th:href="@{/home}">
            ThesisMatch
        </a>

        <div class="ms-auto d-flex gap-2" sec:authorize="isAuthenticated()">
            <a th:href="@{/admin}" class="btn btn-dark" sec:authorize="hasRole('ADMIN')">Adminansicht</a>
            <a th:href="@{/profil}" class="btn btn-dark" sec:authorize="hasRole('BETREUER')">Profil</a>
            
            <a th:href="@{/home}" class="btn btn-dark" sec:authorize="hasRole('ADMIN') or !hasRole('BETREUER')">Home</a>

            <a th:href="@{/betreuende}" class="btn btn-dark"
                sec:authorize="hasRole('ADMIN') or !hasRole('BETREUER')">Betreuende</a>

            <a th:href="@{/themen}" class="btn btn-dark"
                sec:authorize="hasRole('ADMIN') or !hasRole('BETREUER')">Themen</a>

            <a th:href="@{/matching}" class="btn btn-dark"
                sec:authorize="hasRole('ADMIN') or !hasRole('BETREUER')">Matching</a>
        </div>

    </nav>

    <main class="container my-5">

        <div class="mb-4">
            <h1 class="fw-bold">Betreuende durchsuchen</h1>
            <p class="text-muted">
                Finde passende Betreuende nach Name oder Fachgebiet.
            </p>
        </div>

        <!-- SEARCH & FILTER CARD -->
        <section aria-label="Suche und Filter" class="card shadow-sm mb-4">
            <div class="card-body">

                <form action="/betreuende" method="get" class="row g-3">

                    <div class="col-md-6">
                        <label for="searchname" class="form-label fw-semibold">
                            Name
                        </label>
                        <input id="searchname" name="searchname" type="search" class="form-control"
                            th:value="${searchname}" placeholder="Name suchen…">
                    </div>

                    <div class="col-md-6">
                        <label for="fachgebiet" class="form-label fw-semibold">
                            Fachgebiet
                        </label>
                        <select id="fachgebiet" name="tag" class="form-select">
                            <option value="">Alle Fachgebiete</option>

                            <option th:each="t : ${allTags}" th:value="${t}" th:text="${t}" th:selected="${tag == t}">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-dark">
                            <i class="fa-solid fa-magnifying-glass me-1"></i>
                            Suchen
                        </button>
                        <a href="betreuende" class="btn btn-outline-secondary">
                            Zurücksetzen
                        </a>
                    </div>

                </form>
            </div>
        </section>

        <!-- RESULTS -->
        <section aria-label="Suchergebnisse">
            <h2 class="fw-bold mb-3">Suchergebnisse</h2>

            <div class="d-flex flex-column gap-3">

                <div class="border rounded-3 bg-white px-4 py-3
                    d-flex justify-content-between align-items-center
                    shadow-sm" th:each="betreuer : ${betreuendeListe}">

                    <!-- LEFT -->
                    <div>
                        <h5 class="fw-bold mb-1"
                            th:text="${betreuer.titel + ' ' + betreuer.firstName + ' ' + betreuer.lastName}">
                            Jens Bendo
                        </h5>

                        <div class="text-muted small">
                            Fachgebiet:
                            <span class="fw-bold text-dark"
                                th:text="${#strings.listJoin(betreuer.tags, ', ')}">>Compilerbau, KI</span>
                        </div>

                    </div>

                    <!-- RIGHT -->
                    <a th:href="@{/betreuende/{fachId}(fachId=${betreuer.fachId})}"
                        class="btn btn-outline-dark btn-sm px-3">
                        <i class="fa-solid fa-user me-1"></i>
                        Profil ansehen
                    </a>

                </div>

            </div>
        </section>


    </main>


</body>

</html>
