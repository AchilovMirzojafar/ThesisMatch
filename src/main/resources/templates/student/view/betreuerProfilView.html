<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ThesisMatch – Betreuerprofil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <a class="navbar-brand fw-bold fs-4 text-dark text-decoration-none" th:href="@{/home}">
        ThesisMatch
    </a>
</nav>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="mb-4">
        <h2 class="fw-semibold mb-1">
            <span th:text="${betreuer.titel}"></span>
            <span th:text="${betreuer.firstName}"></span>
            <span th:text="${betreuer.lastName}"></span>
        </h2>
        <p class="text-muted mb-0">
            Betreuerprofil
        </p>
    </div>

    <div class="row g-4">

        <!-- LEFT: PROFILBILD -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <img src="https://img.freepik.com/premium-vector/user-profile-icon-flat-style-member-avatar-vector-illustration-isolated-background-human-permission-sign-business-concept_157943-15752.jpg"
                         alt="Profilbild"
                         class="rounded-circle"
                         style="width: 130px; height: 160px; object-fit: cover;">
                </div>
            </div>
        </div>

        <!-- RIGHT: KONTAKTINFO -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h5 class="mb-3">Kontakt</h5>

                    <p>
                        <strong>E-Mail:</strong>
                        <span th:text="${betreuer.email}"></span>
                    </p>

                    <p th:if="${betreuer.phone != null}">
                        <strong>Telefon:</strong>
                        <span th:text="${betreuer.phone}"></span>
                    </p>

                </div>
            </div>
        </div>
    </div>

    <!-- FACHGEBIETE -->
    <div class="card shadow-sm mt-4">
        <div class="card-body">

            <h5>Fachgebiete</h5>

            <div class="d-flex flex-wrap gap-2 mt-2">
                <span class="badge bg-secondary"
                      th:each="tag : ${betreuer.tags}"
                      th:text="${tag}">
                </span>
            </div>

        </div>
    </div>

    <!-- THEMEN -->
    <div class="card shadow-sm mt-4">
        <div class="card-body p-3">
            <h5 class="mb-3">Angebotene Themen</h5>

            <div class="table-responsive">
                <table class="table table-sm align-middle">
                    <thead>
                    <tr>
                        <th>Titel</th>
                        <th>Tags</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="t : ${themaListe}">
                        <td th:text="${t.title}"></td>
                        <td>
                            <span th:each="tag : ${t.tags}"
                                  class="badge text-bg-secondary me-1"
                                  th:text="${tag}">
                            </span>
                        </td>
                    </tr>

                    <tr th:if="${themaListe == null or #lists.isEmpty(themaListe)}">
                        <td colspan="2" class="text-center text-muted">
                            Keine Themen verfügbar
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</body>
</html>
