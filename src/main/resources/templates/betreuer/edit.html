<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ThesisMatch – Betreuerprofil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <a class="navbar-brand fw-bold fs-4 text-dark text-decoration-none" th:href="@{/profil}">
        ThesisMatch
    </a>

</nav>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="mb-4">
        <h2 class="fw-semibold">
            Willkommen
            <span sec:authentication="principal.attributes['login']"></span>
        </h2>
        <p class="text-muted mb-0">
            Hier kannst du dein Betreuerprofil bearbeiten.
        </p>
    </div>

    <div class="row g-4">

        <!-- LEFT: PROFILBILD -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                        <button type="submit" class="btn btn-outline-dark btn-sm w-100">
                            Profilbild hochladen
                        </button>
                    </form>

                </div>
            </div>
        </div>

        <!-- RIGHT: PROFILDATEN -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h5 class="mb-3">Kontaktinformationen</h5>

                    <form method="post" th:action="@{/profil}">

                        <div class="mb-3">
                            <label for="firstName" class="form-label">Vorname</label>
                            <input type="text"
                                   id="firstName"
                                   name="firstName"
                                   class="form-control"
                                   th:value="${betreuer.firstName}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="lastName" class="form-label">Nachname</label>
                            <input type="text"
                                   id="lastName"
                                   name="lastName"
                                   class="form-control"
                                   th:value="${betreuer.lastName}"
                                   required>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">E-Mail</label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   th:value="${betreuer.email}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Telefon</label>
                            <input type="text"
                                   name="phone"
                                   class="form-control"
                                   th:value="${betreuer.phone}">
                        </div>

                        <h6 class="mt-4">Fachgebiete (Tags)</h6>

                        <div class="d-flex flex-wrap gap-3 mt-2">
                            <div th:each="tag : ${allTags}">
                                <label class="form-check-label">
                                    <input type="checkbox"
                                           class="form-check-input me-1"
                                           name="tags"
                                           th:value="${tag}"
                                           th:checked="${betreuer.tags.contains(tag)}">
                                    <span th:text="${tag}"></span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark mt-4">
                            Profil speichern
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- DATEIEN -->
    <div class="card shadow-sm mt-4">
        <div class="card-body">

            <h5>Dateien</h5>

            <form method="post"
                  th:action="@{/files}"
                  enctype="multipart/form-data"
                  class="row g-3 mt-2">

                <div class="col-md-6">
                    <label class="form-label">Titel</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Datei</label>
                    <input type="file"
                           name="file"
                           class="form-control"
                           accept=".pdf,.zip,.md"
                           required>
                </div>

                <div class="col-md-12">
                    <label class="form-label">Beschreibung (optional)</label>
                    <textarea name="description"
                              class="form-control"
                              rows="2"></textarea>
                </div>

                <div class="col-md-12">
                    <button type="submit" class="btn btn-outline-dark">
                        Datei hochladen
                    </button>
                </div>
            </form>

            <hr>

            <!-- Vorhandene Dateien -->
            <div th:each="file : ${betreuer.files}" class="mb-2">
                <i class="fa-solid fa-file me-2"></i>
                <a th:href="@{/files/{id}(id=${file.storedFilename})}"
                   th:text="${file.title}"></a>
                <span class="text-muted small">
                    (hochgeladen am <span th:text="${file.uploadedAt}"></span>)
                </span>
            </div>

        </div>
    </div>

</div>

</body>
</html>
