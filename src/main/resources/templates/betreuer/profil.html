<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ThesisMatch – Profil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <a class="navbar-brand fw-bold fs-4 text-dark text-decoration-none" th:href="@{/profil}">
        ThesisMatch
    </a>
</nav>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="mb-4 d-flex align-items-center">
        <div>
            <h2 class="fw-semibold mb-1">
                Profil von
                <span th:text="${betreuer.titel}"></span>
                <span th:text="${betreuer.firstName}"></span>
                <span th:text="${betreuer.lastName}"></span>
            </h2>
            <p class="text-muted mb-0">
                Öffentliche Profilansicht
            </p>
        </div>

    </div>



    <div class="row g-4">

        <!-- LEFT: PROFILBILD -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <img src="https://img.freepik.com/premium-vector/user-profile-icon-flat-style-member-avatar-vector-illustration-isolated-background-human-permission-sign-business-concept_157943-15752.jpg?semt=ais_hybrid "
                         alt="Profilbild"
                         class="rounded-circle"
                         style="width: 130px; height: 160px; object-fit: cover;">
                </div>
            </div>
        </div>

        <!-- RIGHT: KONTAKTINFO -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h5 class="mb-3">Kontaktinformationen</h5>

                    <p>
                        <strong>Name:</strong>
                        <span th:text="${betreuer.titel}"></span>
                        <span th:text="${betreuer.firstName}"></span>
                        <span th:text="${betreuer.lastName}"></span>
                    </p>

                    <p>
                        <strong>E-Mail:</strong>
                        <span th:text="${betreuer.email}"></span>
                    </p>

                    <p>
                        <strong>Telefon:</strong>
                        <span th:text="${betreuer.phone}"></span>
                    </p>

                </div>
            </div>
        </div>
    </div>

    <!-- TAGS -->
    <div class="card shadow-sm mt-4">
        <div class="card-body">

            <h5>Fachgebiete</h5>

            <div class="d-flex flex-wrap gap-2 mt-2">
                <span class="badge bg-secondary"
                      th:each="tag : ${betreuer.tags}"
                      th:text="${tag}">
                </span>
            </div>

        </div>
    </div>

    <!-- DATEIEN -->
    <div class="card shadow-sm mt-4">
        <div class="card-body">

            <h5>Dateien</h5>

            <div th:if="${#lists.isEmpty(betreuer.files)}"
                 class="text-muted">
                Keine Dateien vorhanden.
            </div>

            <div th:each="file : ${betreuer.files}" class="mb-2">
                <i class="fa-solid fa-file me-2"></i>
                <a th:href="@{/betreuer/files/{id}(id=${file.storedFilename})}"
                   th:text="${file.title}"></a>
                <span class="text-muted small">
                    (hochgeladen am <span th:text="${file.uploadedAt}"></span>)
                </span>
            </div>

        </div>
    </div>

    <div class="mb-4 d-flex align-items-center">
        <div class="ms-auto d-flex gap-2">
            <a th:href="@{/edit}"
               class="btn btn-outline-dark">
                <i class="fa-solid fa-pen me-1"></i>
                Profil bearbeiten
            </a>

            <a th:href="@{/newThema}"
               class="btn btn-outline-primary">
                <i class="fa-solid fa-plus me-1"></i>
                Neues Thema
            </a>
        </div>
    </div>


</div>

</body>
</html>
