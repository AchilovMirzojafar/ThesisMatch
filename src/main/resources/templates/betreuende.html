<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ThesisMatch – Themen</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <a class="navbar-brand fw-bold fs-4 text-dark text-decoration-none" href="home">
        ThesisMatch
    </a>
    <div class="ms-auto d-flex gap-2">
        <a href="home" class="btn btn-dark">Home</a>
        <a href="betreuende" class="btn btn-dark">Betreuende</a>
        <a href="themen" class="btn btn-dark active">Themen</a>
        <a href="matching" class="btn btn-dark">Matching</a>
    </div>
</nav>

<!-- MAIN -->
<main class="container my-5">

    <!-- PAGE HEADER -->
    <div class="mb-4">
        <h1 class="fw-bold">Betreuende durchsuchen</h1>
        <p class="text-muted">
            Finde passende Betreuende nach Name oder Fachgebiet.
        </p>
    </div>

    <!-- SEARCH & FILTER CARD -->
    <section aria-label="Suche und Filter" class="card shadow-sm mb-4">
        <div class="card-body">

            <form action="#" method="get" class="row g-3">

                <div class="col-md-6">
                    <label for="q" class="form-label fw-semibold">
                        Name
                    </label>
                    <input
                            id="q"
                            name="q"
                            type="search"
                            class="form-control"
                            placeholder="Name suchen…">
                </div>

                <div class="col-md-6">
                    <label for="fachgebiet" class="form-label fw-semibold">
                        Fachgebiet
                    </label>
                    <select id="fachgebiet" name="fachgebiet" class="form-select">
                        <option value="">Alle Fachgebiete</option>
                        <option value="compilerbau">Compilerbau</option>
                        <option value="formale-methoden">Formale Methoden</option>
                        <option value="organisation">Organisation</option>
                        <option value="rust">Rust</option>
                    </select>
                </div>

                <div class="col-12 d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-dark">
                        <i class="fa-solid fa-magnifying-glass me-1"></i>
                        Suchen
                    </button>
                    <a href="betreuende" class="btn btn-outline-secondary">
                        Zurücksetzen
                    </a>
                </div>

            </form>
        </div>
    </section>

    <!-- RESULTS -->
    <section aria-label="Suchergebnisse">
        <h2 class="fw-bold mb-3">Suchergebnisse</h2>

        <!-- RESULT CARD -->
        <article aria-label="Betreuenden-Karte" class="card shadow-sm mb-3">
            <div class="card-body">
                <h5 class="card-title fw-bold mb-1">
                    Beispiel Betreuender
                </h5>
                <p class="card-text text-muted mb-2">
                    Fachgebiet: Compilerbau
                </p>
                <a href="#" class="btn btn-sm btn-dark">
                    Details ansehen
                </a>
            </div>
        </article>

        <!-- Optional: Empty State -->
        <!--
        <div class="alert alert-secondary">
            Keine Betreuenden gefunden.
        </div>
        -->

    </section>

</main>

<!-- FOOTER -->
<footer class="mt-auto bg-white border-top">
    <div class="container py-3 text-center text-muted small">
        © 2025 HHU ThesisMatch · Demo
    </div>
</footer>

</body>
</html>
