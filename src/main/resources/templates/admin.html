<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ThesisMatch – Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <a class="navbar-brand fw-bold fs-4 text-dark text-decoration-none" href="home">
        ThesisMatch
    </a>

    <div class="ms-auto d-flex gap-2">
        <a href="admin" class="btn btn-dark">Home</a>
        <a href="betreuende" class="btn btn-dark">Betreuende</a>
        <a href="themen" class="btn btn-dark">Themen</a>
        <a href="matching" class="btn btn-dark">Matching</a>
    </div>
</nav>

<div class="container-fluid px-4 mt-4" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">

        <!-- Erster Slogan ganz links -->
        <div class="text-start">
            <h1 class="display-6 fw-semibold mb-0">
                FANG DEINEN WEG ZUM<br>
                PERFEKTEN BACHELOR AN
            </h1>
        </div>

        <!-- Zweiter Slogan ganz rechts -->
        <div class="text-end">
            <p class="fs-5 fw-semibold mb-1">
                Willkommen ADMIN 👋
            </p>
            <p class="fs-6 mb-0">
                Du bist eingeloggt als
                <strong sec:authentication="principal.attributes['login']"></strong>
            </p>
        </div>

    </div>

    <!-- Formular darunter -->
    <div class="card shadow-sm">
        <div class="card-body p-3">
            <h5 class="mb-3">Betreuer hinzufügen</h5>

            <form method="post" action="/admin" class="row g-2">

                <div class="col-12 col-md-6">
                    <label for="name" class="form-label">Vorname</label>
                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Vorname eingeben"
                           class="form-control form-control-sm"
                           required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="surname" class="form-label">Nachname</label>
                    <input type="text"
                           id="surname"
                           name="nachname"
                           placeholder="Nachname eingeben"
                           class="form-control form-control-sm">
                </div>

                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-dark btn-sm w-100">Betreuer erstellen</button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
