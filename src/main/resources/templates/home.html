<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ThesisMatch – Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Eigene Styles -->
    <link rel="stylesheet" href="/css/public.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <a class="navbar-brand fw-bold fs-4 text-dark text-decoration-none" href="home">
        ThesisMatch
    </a>

    <div class="ms-auto d-flex gap-2">
        <a href="home" class="btn btn-dark">Home</a>
        <a href="betreuende" class="btn btn-dark">Betreuende</a>
        <a href="themen" class="btn btn-dark">Themen</a>
        <a href="matching" class="btn btn-dark">Matching</a>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-5">
    <div class="row align-items-center">

        <!-- LEFT: SLOGAN -->
        <div class="col-md-6">
            <h1 class="display-5 fw-semibold mb-4">
                FANG DEINEN WEG ZUM<br>
                PERFEKTEN BACHELOR AN
            </h1>
            <p class="text-muted fs-5">
                ThesisMatch verbindet Studierende und Betreuende effizient und transparent.
            </p>
        </div>

        <!-- RIGHT: LOGIN CARD -->
        <div class="col-md-5 offset-md-1">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 text-center">
                    <h3 class="mb-3 fw-semibold">Login</h3>

                    <a href="login" class="btn btn-dark btn-lg w-100">
                        <i class="fa-brands fa-github me-2"></i>
                        Login mit GitHub
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
