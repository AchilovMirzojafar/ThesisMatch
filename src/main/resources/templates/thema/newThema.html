<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ThesisMatch – Neues Thema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <a class="navbar-brand fw-bold fs-4 text-dark text-decoration-none" th:href="@{/profil}">
        ThesisMatch
    </a>
</nav>

<div class="container mt-4">

    <div class="mb-4">
        <h2 class="fw-semibold mb-1">Neues Thema</h2>
        <p class="text-muted mb-0">Bitte fülle die Informationen aus.</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post" th:action="@{/newThema}" th:object="${thema}" class="row g-3">

                <div class="col-12">
                    <label class="form-label fw-semibold">Titel *</label>
                    <input type="text" th:field="*{title}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">Tags</label>
                    <!-- если хотите хранить в Thema список tags, удобнее иметь отдельное поле tagInput -->
                    <input type="text" th:field="*{tagInput}" class="form-control" placeholder="z.B. Compilerbau, Rust">
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">Voraussetzungen</label>

                    <div th:each="v : ${allVeranstaltungen}" class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               th:field="*{requirements}"
                               th:value="${v}"
                               th:id="${'req_' + v}">
                        <label class="form-check-label"
                               th:for="${'req_' + v}"
                               th:text="${v}">
                        </label>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Beschreibung (Markdown)</label>
                    <textarea th:field="*{description}" class="form-control" rows="6"></textarea>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-dark">Thema erstellen</button>
                    <a th:href="@{/profil}" class="btn btn-outline-secondary">Abbrechen</a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
